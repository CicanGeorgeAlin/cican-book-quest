<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>1984 — The Watched City</title>

<style>

* {
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #111;

    font-family: Arial, sans-serif;

    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #222;
}

#world {
    position: absolute;

    width: 2200px;
    height: 1600px;

    background:
        linear-gradient(#292929 2px, transparent 2px),
        linear-gradient(90deg, #292929 2px, transparent 2px);

    background-size: 80px 80px;
}


/* ROADS */

.road {
    position: absolute;
    background: #383838;
}

.horizontal {
    width: 2200px;
    height: 160px;
}

.vertical {
    width: 160px;
    height: 1600px;
}


/* BUILDINGS */

.building {
    position: absolute;

    background: #444;

    border: 5px solid #555;

    box-shadow:
        inset 0 0 0 4px #292929;
}


/* PLAYER */

#player {
    position: absolute;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background: white;

    border: 4px solid #111;

    z-index: 50;

    box-shadow:
        0 0 18px rgba(255,255,255,.5);
}


/* CAMERAS */

.camera {
    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #111;

    border: 4px solid #777;

    z-index: 20;
}

.camera::before {
    content: "◉";

    position: absolute;

    left: 14px;
    top: 10px;

    color: white;

    font-size: 28px;
}

.camera::after {
    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    left: -56px;
    top: -56px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.035);
}


/* SECRET ROOM */

#room {
    position: absolute;

    left: 1760px;
    top: 1120px;

    width: 280px;
    height: 250px;

    background: #111;

    border: 7px solid #777;

    z-index: 10;
}

#room::before {
    content: "HIDDEN ROOM";

    position: absolute;

    top: -38px;
    left: 65px;

    color: #aaa;

    letter-spacing: 3px;

    font-size: 13px;
}


/* BOOK */

#book {
    position: absolute;

    left: 1860px;
    top: 1215px;

    width: 65px;
    height: 55px;

    background: white;

    border: 4px solid #111;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;

    z-index: 30;

    box-shadow:
        0 0 30px rgba(255,255,255,.6);
}


/* HUD */

#hud {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    z-index: 100;

    padding: 12px;

    pointer-events: none;
}

#message {
    max-width: 520px;

    margin: auto;

    padding: 12px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.88);

    color: white;

    text-align: center;

    font-size: 14px;
}

#status {
    margin-top: 7px;

    text-align: center;

    color: #aaa;

    font-size: 12px;
}


/* CONTROLS */

#controls {
    position: fixed;

    left: 50%;
    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    z-index: 200;

    display: grid;

    grid-template-columns:
        68px 68px 68px;

    grid-template-rows:
        68px 68px;

    gap: 8px;

    touch-action: none;
}

.control {
    width: 68px;
    height: 68px;

    border: 2px solid #777;

    border-radius: 14px;

    background:
        rgba(10,10,10,.93);

    color: white;

    font-size: 25px;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;
}

.control.pressed {
    background: #555;

    transform: scale(.95);
}

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}


/* READ BUTTON */

#readButton {
    position: fixed;

    left: 50%;

    bottom:
        calc(
            125px +
            env(safe-area-inset-bottom)
        );

    transform: translateX(-50%);

    z-index: 300;

    display: none;

    padding: 15px 25px;

    min-width: 220px;

    border: none;

    border-radius: 10px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;
}

#readButton.show {
    display: block;
}


/* INTRO / FOUND */

.overlay {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,.96);

    color: white;

    padding: 25px;

    text-align: center;
}

.panel {
    width: min(500px, 100%);
}

.panel h1 {
    font-size: 38px;

    letter-spacing: 5px;

    margin-bottom: 20px;
}

.panel p {
    color: #aaa;

    line-height: 1.6;
}

.button {
    display: inline-block;

    margin-top: 20px;

    padding: 14px 25px;

    min-height: 50px;

    border: none;

    border-radius: 9px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;

    text-decoration: none;
}

.secondary {
    background: #333;

    color: white;

    border: 1px solid #777;
}

.hidden {
    display: none !important;
}


/* CAUGHT */

#caught {
    position: fixed;

    inset: 0;

    z-index: 450;

    display: none;

    align-items: center;
    justify-content: center;

    background:
        rgba(70,0,0,.96);

    color: white;

    text-align: center;
}

#caught h2 {
    font-size: 40px;

    letter-spacing: 6px;
}


/* SMALL SCREEN */

@media(max-height:600px) {

    #controls {
        bottom: 8px;

        grid-template-columns:
            58px 58px 58px;

        grid-template-rows:
            58px 58px;
    }

    .control {
        width: 58px;
        height: 58px;
    }

    #readButton {
        bottom: 80px;
    }
}

</style>

</head>


<body>


<div id="game">

    <div id="world">

        <!-- ROADS -->

        <div
            class="road horizontal"
            style="top:350px;">
        </div>

        <div
            class="road horizontal"
            style="top:800px;">
        </div>

        <div
            class="road vertical"
            style="left:500px;">
        </div>

        <div
            class="road vertical"
            style="left:1200px;">
        </div>


        <!-- BUILDINGS -->

        <div
            class="building"
            style="
                left:70px;
                top:60px;
                width:350px;
                height:220px;">
        </div>

        <div
            class="building"
            style="
                left:680px;
                top:60px;
                width:400px;
                height:220px;">
        </div>

        <div
            class="building"
            style="
                left:1450px;
                top:60px;
                width:450px;
                height:230px;">
        </div>

        <div
            class="building"
            style="
                left:80px;
                top:1050px;
                width:350px;
                height:250px;">
        </div>

        <div
            class="building"
            style="
                left:650px;
                top:1050px;
                width:380px;
                height:250px;">
        </div>


        <!-- CAMERAS -->

        <div
            class="camera"
            style="
                left:420px;
                top:290px;">
        </div>

        <div
            class="camera"
            style="
                left:1050px;
                top:450px;">
        </div>

        <div
            class="camera"
            style="
                left:1450px;
                top:700px;">
        </div>

        <div
            class="camera"
            style="
                left:720px;
                top:820px;">
        </div>

        <div
            class="camera"
            style="
                left:1600px;
                top:920px;">
        </div>


        <!-- HIDDEN ROOM -->

        <div id="room"></div>


        <!-- BOOK -->

        <div id="book">
            📖
        </div>


        <!-- PLAYER -->

        <div id="player"></div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div id="message">
            FIND A PLACE WHERE YOU CANNOT BE SEEN.
        </div>

        <div id="status">
            The city is watching.
        </div>

    </div>


    <!-- MOBILE CONTROLS -->

    <div id="controls">

        <button
            class="control up"
            data-direction="up"
            type="button">
            ▲
        </button>

        <button
            class="control left"
            data-direction="left"
            type="button">
            ◀
        </button>

        <button
            class="control down"
            data-direction="down"
            type="button">
            ▼
        </button>

        <button
            class="control right"
            data-direction="right"
            type="button">
            ▶
        </button>

    </div>


    <!-- READ -->

    <button
        id="readButton"
        type="button">

        📖 READ THE BOOK

    </button>

</div>


<!-- INTRO -->

<div
    id="intro"
    class="overlay">

    <div class="panel">

        <h1>
            1984
        </h1>

        <p>
            George Orwell
        </p>

        <p>
            The city is watching.
            Find a place where you
            cannot be seen.
        </p>

        <p>
            <strong>
                Avoid the cameras.
            </strong>
        </p>

        <button
            id="start"
            class="button"
            type="button">

            ENTER THE CITY

        </button>

    </div>

</div>


<!-- FOUND -->

<div
    id="found"
    class="overlay hidden">

    <div class="panel">

        <div style="font-size:60px;">
            📖
        </div>

        <h1>
            BOOK FOUND
        </h1>

        <p>
            You discovered:
        </p>

        <h2>
            1984
        </h2>

        <p>
            George Orwell
        </p>

        <a
            class="button"
            href="https://archive.org/details/dli.ernet.240835"
            target="_blank"
            rel="noopener noreferrer">

            READ 1984

        </a>

        <br>

        <a
            class="button secondary"
            href="../index.html">

            BOOK LIBRARY

        </a>

    </div>

</div>


<!-- CAUGHT -->

<div id="caught">

    <div class="panel">

        <h2>
            YOU WERE SEEN
        </h2>

        <p>
            The cameras found you.
        </p>

        <button
            id="retry"
            class="button"
            type="button">

            TRY AGAIN

        </button>

        <br>

        <a
            class="button secondary"
            href="../index.html">

            BOOK LIBRARY

        </a>

    </div>

</div>


<script>

/* =========================================================
   GAME STATE
========================================================= */

let x = 250;

let y = 650;

const SPEED = 5;

let playing = false;

let discovered = false;


/* =========================================================
   ELEMENTS
========================================================= */

const player =
    document.getElementById(
        "player"
    );

const world =
    document.getElementById(
        "world"
    );

const room =
    document.getElementById(
        "room"
    );

const message =
    document.getElementById(
        "message"
    );

const status =
    document.getElementById(
        "status"
    );

const intro =
    document.getElementById(
        "intro"
    );

const found =
    document.getElementById(
        "found"
    );

const caught =
    document.getElementById(
        "caught"
    );

const readButton =
    document.getElementById(
        "readButton"
    );


/* =========================================================
   MOVEMENT
========================================================= */

const movement = {

    up: false,
    down: false,
    left: false,
    right: false

};


/* =========================================================
   RESET
========================================================= */

function resetGame() {

    x = 250;

    y = 650;

    discovered = false;

    playing = false;

    clearMovement();

    found.classList.add(
        "hidden"
    );

    caught.style.display =
        "none";

    readButton.classList.remove(
        "show"
    );

    message.textContent =
        "FIND A PLACE WHERE YOU CANNOT BE SEEN.";

    status.textContent =
        "The city is watching.";

    updatePlayer();

    updateCamera();

}


/* =========================================================
   START
========================================================= */

document
    .getElementById("start")
    .addEventListener(
        "click",
        function() {

            intro.classList.add(
                "hidden"
            );

            playing = true;

        }
    );


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer() {

    player.style.left =
        x + "px";

    player.style.top =
        y + "px";

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    const screenX =
        window.innerWidth / 2;

    const screenY =
        window.innerHeight / 2;


    let cameraX =
        screenX -
        x -
        21;

    let cameraY =
        screenY -
        y -
        21;


    const minX =
        window.innerWidth -
        2200;

    const minY =
        window.innerHeight -
        1600;


    cameraX =
        Math.min(
            0,
            Math.max(
                minX,
                cameraX
            )
        );


    cameraY =
        Math.min(
            0,
            Math.max(
                minY,
                cameraY
            )
        );


    world.style.transform =
        `translate(
            ${cameraX}px,
            ${cameraY}px
        )`;

}


/* =========================================================
   MOVE
========================================================= */

function movePlayer() {

    if (!playing) {
        return;
    }


    let dx = 0;

    let dy = 0;


    if (movement.up)
        dy -= SPEED;

    if (movement.down)
        dy += SPEED;

    if (movement.left)
        dx -= SPEED;

    if (movement.right)
        dx += SPEED;


    /*
     * Normalize diagonal movement.
     */

    if (
        dx !== 0 &&
        dy !== 0
    ) {

        const amount =
            SPEED /
            Math.sqrt(2);

        dx =
            dx > 0
                ? amount
                : -amount;

        dy =
            dy > 0
                ? amount
                : -amount;

    }


    x += dx;

    y += dy;


    /*
     * Keep player inside world.
     */

    x =
        Math.max(
            0,
            Math.min(
                2150,
                x
            )
        );

    y =
        Math.max(
            0,
            Math.min(
                1550,
                y
            )
        );


    updatePlayer();

    updateCamera();

    checkCameras();

    checkRoom();

}


/* =========================================================
   CAMERA DETECTION
========================================================= */

function checkCameras() {

    const cameras =
        document.querySelectorAll(
            ".camera"
        );


    cameras.forEach(
        camera => {

            const cx =
                parseInt(
                    camera.style.left
                );

            const cy =
                parseInt(
                    camera.style.top
                );


            const cameraCenterX =
                cx + 32;

            const cameraCenterY =
                cy + 32;


            const playerCenterX =
                x + 21;

            const playerCenterY =
                y + 21;


            const dx =
                playerCenterX -
                cameraCenterX;

            const dy =
                playerCenterY -
                cameraCenterY;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance < 115 &&
                playing
            ) {

                playing = false;

                clearMovement();

                caught.style.display =
                    "flex";

            }

        }
    );

}


/* =========================================================
   ROOM DETECTION
========================================================= */

function checkRoom() {

    const inside =

        x + 21 > 1780 &&
        x + 21 < 2020 &&
        y + 21 > 1140 &&
        y + 21 < 1340;


    if (
        inside &&
        !discovered
    ) {

        discovered = true;

        message.textContent =
            "YOU FOUND THE HIDDEN ROOM.";

        status.textContent =
            "You cannot be seen here.";

        readButton.classList.add(
            "show"
        );

    }


    if (!inside) {

        readButton.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   READ BOOK
========================================================= */

readButton.addEventListener(
    "click",
    function() {

        if (!discovered) {
            return;
        }

        playing = false;

        clearMovement();

        found.classList.remove(
            "hidden"
        );

    }
);


/* =========================================================
   RETRY
========================================================= */

document
    .getElementById("retry")
    .addEventListener(
        "click",
        function() {

            resetGame();

            intro.classList.remove(
                "hidden"
            );

        }
    );


/* =========================================================
   MOBILE CONTROLS
========================================================= */

document
    .querySelectorAll(
        ".control"
    )
    .forEach(
        button => {

            const direction =
                button.dataset.direction;


            function press(e) {

                e.preventDefault();

                e.stopPropagation();

                movement[direction] =
                    true;

                button.classList.add(
                    "pressed"
                );


                if (
                    e.pointerId !==
                    undefined
                ) {

                    try {

                        button.setPointerCapture(
                            e.pointerId
                        );

                    }

                    catch(error) {}

                }

            }


            function release(e) {

                e.preventDefault();

                e.stopPropagation();

                movement[direction] =
                    false;

                button.classList.remove(
                    "pressed"
                );

            }


            button.addEventListener(
                "pointerdown",
                press,
                {
                    passive:false
                }
            );


            button.addEventListener(
                "pointerup",
                release,
                {
                    passive:false
                }
            );


            button.addEventListener(
                "pointercancel",
                release,
                {
                    passive:false
                }
            );


            button.addEventListener(
                "lostpointercapture",
                release,
                {
                    passive:false
                }
            );

        }
    );


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e) {

        const key =
            e.key.toLowerCase();


        if (
            key === "w" ||
            key === "arrowup"
        ) {
            movement.up = true;
            e.preventDefault();
        }


        if (
            key === "s" ||
            key === "arrowdown"
        ) {
            movement.down = true;
            e.preventDefault();
        }


        if (
            key === "a" ||
            key === "arrowleft"
        ) {
            movement.left = true;
            e.preventDefault();
        }


        if (
            key === "d" ||
            key === "arrowright"
        ) {
            movement.right = true;
            e.preventDefault();
        }

    },
    {
        passive:false
    }
);


/* =========================================================
   KEYBOARD RELEASE
========================================================= */

document.addEventListener(
    "keyup",
    function(e) {

        const key =
            e.key.toLowerCase();


        if (
            key === "w" ||
            key === "arrowup"
        )
            movement.up = false;


        if (
            key === "s" ||
            key === "arrowdown"
        )
            movement.down = false;


        if (
            key === "a" ||
            key === "arrowleft"
        )
            movement.left = false;


        if (
            key === "d" ||
            key === "arrowright"
        )
            movement.right = false;

    }
);


/* =========================================================
   CLEAR MOVEMENT
========================================================= */

function clearMovement() {

    movement.up = false;

    movement.down = false;

    movement.left = false;

    movement.right = false;


    document
        .querySelectorAll(
            ".control"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "pressed"
                )
        );

}


/* =========================================================
   SAFETY
========================================================= */

window.addEventListener(
    "blur",
    clearMovement
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            document.hidden
        ) {

            clearMovement();

        }

    }
);


/* Disable long-press menu */

document.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    movePlayer();

    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   START
========================================================= */

resetGame();

gameLoop();

</script>

</body>

</html>
