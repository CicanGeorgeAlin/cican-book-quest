s behavior even when observation is uncertain. The fear of being watched becomes a form of internal discipline."},{"title":"THEME — PRIVACY","text":"Privacy is politically important because private thought and relationships can create loyalties outside official control."},{"title":"THEME — FEAR","text":"Fear is used not simply to punish but to reshape behavior and eventually undermine a person's ability to maintain independent commitments."},{"title":"THEME — LOVE","text":"Private love becomes significant because it creates a bond that is not defined by the Party. The destruction of that bond is therefore part of the Party's wider objective."},{"title":"THEME — DESIRE","text":"The Party's restrictions on sexuality show that bodily desire can be treated as a political issue when private attachment competes with institutional loyalty."},{"title":"THEME — IDENTITY","text":"Winston's struggle is partly a struggle to remain a distinct individual with memories, preferences and judgments that do not come entirely from the Party."},{"title":"THEME — CONFORMITY","text":"Conformity is maintained through rewards, rituals, language, surveillance, fear and social pressure. The system does not rely on punishment alone."},{"title":"THEME — PROPAGANDA","text":"Propaganda supplies repeated narratives and emotional cues that help citizens interpret events according to official expectations."},{"title":"THEME — CLASS","text":"Oceania contains distinctions between Inner Party, Outer Party and proles. The novel examines how these groups experience power differently."},{"title":"THEME — WAR","text":"Permanent war provides a continuing political emergency and consumes resources. Its changing alliances also demonstrate the instability of official truth."},{"title":"THEME — SCARCITY","text":"Shortages make ordinary life uncomfortable while official announcements claim success. The gap between experience and statistics becomes politically important."},{"title":"THEME — TECHNOLOGY","text":"Technology in the novel is not automatically oppressive; its significance comes from how institutions use it for communication, observation and control."},{"title":"THEME — BUREAUCRACY","text":"Historical falsification is presented as routine administrative work. Bureaucratic processes can therefore make extraordinary political control appear ordinary."},{"title":"THEME — INDIVIDUAL VS STATE","text":"The central conflict places private judgment against an institution claiming authority over facts, language and behavior."},{"title":"THEME — RESISTANCE","text":"Resistance begins with small acts of independent thought and grows into relationships and imagined political organization. The novel also explores why resistance is vulnerable."},{"title":"THEME — BETRAYAL","text":"Betrayal becomes the ultimate test of whether political coercion can destroy private loyalty. Winston's response under extreme fear changes the meaning of his resistance."},{"title":"THEME — REALITY","text":"The novel separates physical reality from the ability to establish shared knowledge about reality. If records and language are controlled, proving facts becomes much harder."},{"title":"THEME — EVIDENCE","text":"Photographs, documents, memories and physical objects can all function as evidence. The Party's power includes the ability to remove or reinterpret such evidence."},{"title":"THEME — FREEDOM","text":"Freedom in the novel includes more than physical movement. It also involves the ability to think, remember, speak and form relationships independently."},{"title":"THEME — HOPE","text":"Hope is associated with memory, ordinary human life and the possibility of a future beyond the Party. The novel deliberately tests whether such hope can survive coercion."},{"title":"OBJECT / SYMBOL — THE DIARY","text":"Winston's diary is a physical record of private thought. Writing makes his ideas more definite while also creating evidence that could be used against him."},{"title":"OBJECT / SYMBOL — THE GLASS PAPERWEIGHT","text":"The glass paperweight represents Winston's attraction to the material past and his desire to preserve something outside the Party's official world. Its destruction has symbolic importance."},{"title":"OBJECT / SYMBOL — CORAL INSIDE THE PAPERWEIGHT","text":"The coral enclosed in the paperweight gives the object a sense of preserved time. Winston's fascination with it reflects his wish to keep a small, protected piece of history."},{"title":"OBJECT / SYMBOL — THE RED-ARMED WOMAN","text":"The prole woman Winston observes singing becomes associated with endurance and fertility. Her ordinary physical life contrasts with the Party's controlled existence."},{"title":"OBJECT / SYMBOL — VICTORY GIN","text":"Victory Gin is an everyday product carrying the Party's branding. It contributes to the novel's picture of a society where ideology is present even in routine consumption."},{"title":"OBJECT / SYMBOL — VICTORY COFFEE","text":"Victory Coffee represents the limited and often poor-quality goods available to ordinary citizens. The contrast between branding and lived experience reinforces the theme of propaganda."},{"title":"OBJECT / SYMBOL — THE RAZOR BLADES","text":"Winston's concern with ordinary scarce objects contributes to the novel's material realism. Small shortages remind him that official statistics do not necessarily match daily life."},{"title":"OBJECT / SYMBOL — THE PHOTOGRAPH","text":"The surviving photograph of Jones, Aaronson and Rutherford is powerful because it provides material evidence against a later Party claim. It represents the possibility of objective evidence surviving political revision."},{"title":"OBJECT / SYMBOL — THE CHESTNUT TREE","text":"The chestnut tree is connected to defeated political figures and the emotional aftermath of coercion. It becomes part of the novel's imagery of loss and resignation."},{"title":"OBJECT / SYMBOL — THE GOLDEN COUNTRY","text":"The Golden Country is an imagined landscape of natural beauty and openness. It functions as a counter-image to the controlled spaces of Oceania."},{"title":"OBJECT / SYMBOL — THE TELESCREEN","text":"The telescreen is both a communication device and an instrument of surveillance. It symbolizes the collapse of a secure boundary between public and private life."},{"title":"OBJECT / SYMBOL — THE RED SASH","text":"Julia's appearance in the Anti-Sex League sash initially makes Winston suspect her. The same political symbol later contrasts with her private behavior."},{"title":"OBJECT / SYMBOL — THE PAPERWEIGHT ROOM","text":"The room above the shop appears to contain a preserved past. Its apparent privacy becomes part of Winston's illusion of safety."},{"title":"OBJECT / SYMBOL — THE BOOK","text":"The forbidden book provides Winston with a theory of the Party's social and political structure. Its importance lies in explanation rather than in simply supplying forbidden information."},{"title":"OBJECT / SYMBOL — THE DICTIONARY","text":"The Newspeak dictionary represents the Party's attempt to engineer language systematically. Successive editions show that vocabulary itself can become a political project."},{"title":"OBJECT / SYMBOL — THE BOOT","text":"The image of a boot crushing a human face symbolizes endless political domination. It expresses the Party's conception of power as something that must remain active and absolute."},{"title":"OBJECT / SYMBOL — THE BELLS","text":"Public sounds and announcements punctuate daily life in Oceania. They contribute to an environment in which citizens are constantly reminded of collective political activity."},{"title":"OBJECT / SYMBOL — THE TWO MINUTES HATE","text":"The ritual channels anger toward designated enemies. It demonstrates how political systems can organize emotion as well as information."},{"title":"OBJECT / SYMBOL — THE DAILY ROUTINE","text":"Work, exercise, meals, announcements and rituals create a predictable structure around Party life. Routine can make extraordinary political control feel normal."},{"title":"OBJECT / SYMBOL — THE MEMORY HOLE","text":"As both an object and an idea, the memory hole shows that historical erasure requires physical destruction as well as ideological instruction."},{"title":"ORWELL / CONTEXT — GEORGE ORWELL","text":"George Orwell was the pen name of Eric Arthur Blair. His political writing repeatedly examined language, power, social inequality and authoritarianism."},{"title":"ORWELL / CONTEXT — ORWELL'S POLITICAL WRITING","text":"Orwell's nonfiction and essays are important context for 1984 because they show his interest in how political language can distort thought and public understanding."},{"title":"ORWELL / CONTEXT — ANIMAL FARM","text":"Animal Farm, published before 1984, is another major Orwell work concerned with political power, propaganda and the transformation of revolutionary ideals."},{"title":"ORWELL / CONTEXT — SPANISH CIVIL WAR","text":"Orwell's experience in the Spanish Civil War strongly influenced his political understanding and his suspicion of propaganda, factionalism and falsified narratives."},{"title":"ORWELL / CONTEXT — TOTALITARIANISM","text":"The term totalitarianism is useful context for understanding the political system depicted in 1984. The novel imagines a state seeking unusually comprehensive control over society and thought."},{"title":"ORWELL / CONTEXT — WORLD WAR II","text":"The Second World War shaped the political environment in which Orwell wrote. Wartime propaganda, censorship, shortages and shifting alliances form part of the broader historical context."},{"title":"ORWELL / CONTEXT — STALINISM","text":"The novel reflects Orwell's opposition to authoritarian political systems, including Stalinist practices, while creating the fictional system of Oceania rather than simply reproducing one historical regime."},{"title":"ORWELL / CONTEXT — NAZI PROPAGANDA","text":"The propaganda systems of twentieth-century dictatorships provide historical context for Orwell's interest in emotional manipulation, political language and manufactured narratives."},{"title":"ORWELL / CONTEXT — POLITICAL LANGUAGE","text":"Orwell's nonfiction repeatedly examines how political language can become vague, euphemistic or misleading. 1984 turns these concerns into the fictional language system of Newspeak."},{"title":"ORWELL / CONTEXT — THE POSTWAR WORLD","text":"1984 was published in 1949, after World War II and amid major geopolitical tensions. Its fictional world reflects anxieties about dictatorship, war and political control."},{"title":"ORWELL / CONTEXT — ORWELL'S ILLNESS","text":"The Orwell Foundation notes that Orwell wrote 1984 while seriously ill with tuberculosis. This biographical context helps explain the circumstances of its composition without reducing the novel to biography."},{"title":"ORWELL / CONTEXT — PUBLICATION YEAR","text":"Nineteen Eighty-Four was published in 1949. It was Orwell's final completed novel and became one of his best-known works."},{"title":"ORWELL / CONTEXT — PUBLISHER","text":"The first British edition was published by Secker & Warburg. Publication history is part of understanding how the novel entered public and literary culture."},{"title":"ORWELL / CONTEXT — TITLE","text":"The title Nineteen Eighty-Four places the story in a near-future date relative to Orwell's time. The date became culturally significant far beyond the original fictional setting."},{"title":"ORWELL / CONTEXT — SENATE HOUSE","text":"The Orwell Foundation notes that Senate House in London helped inspire Orwell's fictional Ministry of Truth. The connection demonstrates how real environments can become transformed into fictional settings."},{"title":"ORWELL / CONTEXT — ORWELL AND LANGUAGE","text":"Orwell's concern with clear language connects his essays to the fictional Newspeak project. 1984 dramatizes what can happen when language is deliberately made less capable of expressing independent thought."},{"title":"ORWELL / CONTEXT — ORWELL AND HISTORY","text":"Orwell was deeply concerned with political falsification and the relationship between evidence and power. These concerns become central to Winston's work."},{"title":"ORWELL / CONTEXT — ORWELL AND SOCIALISM","text":"Orwell described himself as a democratic socialist, while strongly criticizing authoritarian politics. The novel's political context is therefore more complex than a simple opposition between left and right."},{"title":"ORWELL / CONTEXT — ORWELL'S ESSAYS","text":"Essays such as those on political language, nationalism and literature provide useful companion material for understanding the intellectual questions behind 1984."},{"title":"ORWELL / CONTEXT — ORWELL FOUNDATION","text":"The Orwell Foundation preserves and presents substantial material on Orwell's life, writing and legacy. It is an important reference point for contextual information about the novel."},{"title":"LITERARY ANALYSIS — THE THREE-PART STRUCTURE","text":"The novel moves from private awareness to active private resistance and finally to direct state coercion. The three-part structure progressively removes Winston's ability to control his circumstances."},{"title":"LITERARY ANALYSIS — PRIVATE TO PUBLIC","text":"Winston's private diary begins the story as an apparently isolated act. His relationship, political curiosity and eventual arrest turn private thought into a public confrontation."},{"title":"LITERARY ANALYSIS — THE PAST AS A BATTLEFIELD","text":"The Party's control of history means that the past becomes an active political battlefield. Winston's work demonstrates how changing records can change the available evidence."},{"title":"LITERARY ANALYSIS — THE FUTURE AS A POLITICAL TOOL","text":"The Party's predictions about production, war and social progress help justify present policies. Future claims can therefore be used as propaganda even when they later require revision."},{"title":"LITERARY ANALYSIS — THE APPENDIX'S TENSE","text":"The appendix is written as though Newspeak belongs to a historical period being described from later knowledge. This framing creates an important distinction between the narrative world and the appendix's implied perspective."},{"title":"LITERARY ANALYSIS — IRONY OF THE MINISTRIES","text":"The names of the four ministries deliberately conflict with their functions. This institutional irony demonstrates how language can be used to conceal rather than reveal."},{"title":"LITERARY ANALYSIS — WINSTON'S JOB AS METAPHOR","text":"Winston's bureaucratic work is simultaneously literal employment and a model of the political system. He continually replaces inconvenient evidence with an approved version."},{"title":"LITERARY ANALYSIS — JULIA AND WINSTON AS DIFFERENT RESISTORS","text":"Winston seeks explanations and historical truth while Julia prioritizes practical private freedom. Their differences prevent resistance from being reduced to a single motive."},{"title":"LITERARY ANALYSIS — THE PROLES AND HOPE","text":"Winston's belief that the proles could change history is connected to their numerical strength, but the novel also shows why numbers alone do not automatically become political power."},{"title":"LITERARY ANALYSIS — THE ROLE OF THE BOOK WITHIN THE BOOK","text":"The forbidden book gives Winston a framework for understanding class structure and perpetual war. It is important because it transforms scattered observations into a theory."},{"title":"LITERARY ANALYSIS — O'BRIEN'S METHOD","text":"O'Brien does not rely on physical force alone. He combines pain, argument, contradiction and demands for intellectual surrender, making the interrogation a struggle over the definition of reality."},{"title":"LITERARY ANALYSIS — ROOM 101 AS INDIVIDUALIZED FEAR","text":"Room 101 demonstrates that the most effective coercion may be personalized. The Party does not need one universal fear if it can identify what each individual cannot endure."},{"title":"LITERARY ANALYSIS — THE ENDING","text":"The ending shows that the Party has changed Winston's emotional relationship to Julia and Big Brother. The conclusion is therefore about transformed consciousness, not simply imprisonment."},{"title":"LITERARY ANALYSIS — THE READER'S KNOWLEDGE","text":"The reader can compare Winston's perceptions with the full sequence of events. This creates dramatic irony because the reader may notice dangers Winston cannot reliably see."},{"title":"LITERARY ANALYSIS — AMBIGUITY","text":"The novel deliberately leaves some questions unresolved, including aspects of Big Brother, the Brotherhood and the historical origin of the Party's system. Ambiguity reinforces the atmosphere of incomplete information."},{"title":"LITERARY ANALYSIS — MATERIAL EVIDENCE VS MEMORY","text":"The photograph and paperweight demonstrate different forms of connection to the past. One can provide documentary evidence while the other provides personal and symbolic continuity."},{"title":"LITERARY ANALYSIS — CONTROL OF MEANING","text":"The Party seeks not only to decide which statements are true but also to define what words and concepts mean. This is why language, history and power are tightly connected."},{"title":"LITERARY ANALYSIS — CONTROL OF EMOTION","text":"The Party organizes hatred, loyalty and fear through rituals and institutions. Emotional control complements the control of information."},{"title":"LITERARY ANALYSIS — SELF-CENSORSHIP","text":"A surveillance society does not require an observer at every moment. People who fear consequences may censor their own speech, facial expressions, relationships and thoughts."},{"title":"LITERARY ANALYSIS — THE NOVEL AS A SYSTEM","text":"The strongest way to understand 1984 is to see surveillance, propaganda, history, language, fear and punishment as mutually reinforcing mechanisms rather than separate topics."},{"title":"RECEPTION / LEGACY — CULTURAL IMPACT","text":"1984 has contributed vocabulary and concepts that are now used far beyond literary discussion. Terms such as Big Brother, Newspeak, doublethink and Room 101 entered wider cultural language."},{"title":"RECEPTION / LEGACY — THE WORD ORWELLIAN","text":"The adjective Orwellian is commonly used for situations associated with surveillance, manipulation of truth or oppressive political language. Its use should still be distinguished from the specific fictional system Orwell created."},{"title":"RECEPTION / LEGACY — ADAPTATIONS","text":"The novel has been adapted for radio, television, film, theatre and other media. Adaptations provide alternative interpretations of the story while changing the experience of the original text."},{"title":"RECEPTION / LEGACY — 1984 ON SCREEN","text":"Screen adaptations emphasize the visual atmosphere of surveillance and institutional power. Comparing them with the novel reveals which details are preserved, changed or omitted."},{"title":"RECEPTION / LEGACY — STAGE ADAPTATIONS","text":"Theatre adaptations face the challenge of representing internal thought and large institutional systems within a physical performance space. This often changes how Winston's inner life is presented."},{"title":"RECEPTION / LEGACY — EDUCATIONAL USE","text":"1984 is widely studied because it combines narrative, political ideas, language, history and literary technique. A strong educational guide should separate plot facts from interpretation."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: BIG BROTHER","text":"Big Brother is often treated simply as one dictator. The novel's uncertainty about the figure's literal status makes the symbol more important than a straightforward biography."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: NEWSPEAK","text":"Newspeak is sometimes reduced to 'political jargon.' In the novel it is a systematic attempt to reduce the range of expressible thought."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: DOUBLETHINK","text":"Doublethink is not merely hypocrisy. It describes a more demanding mental process in which contradictory beliefs can be held and accepted according to political requirements."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: SURVEILLANCE","text":"The telescreen is not the entire surveillance system. Informers, social pressure, children, institutions and self-monitoring all contribute to control."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: RESISTANCE","text":"Winston's resistance is not a simple heroic rebellion. It is fragmented, uncertain and dependent on information he cannot fully verify."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: THE PROLES","text":"The proles are not simply 'free people.' They live under the Party's wider system even though they receive less direct ideological supervision."},{"title":"RECEPTION / LEGACY — COMMON MISREADING: THE ENDING","text":"The ending should not be understood only as Winston being punished. The crucial development is the attempted transformation of his inner loyalties and beliefs."},{"title":"RECEPTION / LEGACY — WHY THE BOOK ENDURES","text":"The novel remains useful for studying how information, language, memory, institutions and psychology can interact. Its concepts are strongest when understood through the specific events and structures of the story."},{"title":"RECEPTION / LEGACY — READING 1984 CRITICALLY","text":"A careful reading should distinguish what the novel explicitly establishes from interpretations supplied by critics or later commentators. CICAN's knowledge system should preserve that distinction."}];
const BOOK_KNOWLEDGE=KNOWLEDGE.concat(KNOWLEDGE_EXPANSION);

function createOne(px,py,startingSize=MIN_SIZE,isMemory=false){
 const element=document.createElement('div'); element.className='one';
 if(isMemory) element.classList.add('memory-one');
 const face=document.createElement('div'); face.className='cican-face';
 const leftEye=document.createElement('div'); leftEye.className='eye left';
 const rightEye=document.createElement('div'); rightEye.className='eye right';
 face.appendChild(leftEye);face.appendChild(rightEye);element.appendChild(face);
 document.body.appendChild(element);
 const one={x:px,y:py,targetX:px,targetY:py,size:startingSize,element,isMemory,lastTrailX:px,lastTrailY:py};
 ones.push(one);updateOne(one);return one;
}
function updateOne(one){one.element.style.left=one.x+'px';one.element.style.top=one.y+'px';one.element.style.width=one.size+'px';one.element.style.height=one.size+'px'}
function distance(ax,ay,bx,by){const dx=bx-ax,dy=by-ay;return Math.sqrt(dx*dx+dy*dy)}
function createTrail(px,py){const trail=document.createElement('div');trail.className='trail';trail.style.left=px+'px';trail.style.top=py+'px';document.body.appendChild(trail);setTimeout(()=>trail.remove(),1500)}
function findClosestOne(px,py){if(!ones.length)return null;let closest=null,closestDistance=Infinity;for(const one of ones){const d=distance(px,py,one.x,one.y);if(d<closestDistance){closestDistance=d;closest=one}}return closest}
function splitOne(one){const newOne=createOne(one.x+45,one.y,MIN_SIZE,false);newOne.targetX=newOne.x;newOne.targetY=newOne.y;selectedOne=one;growing=false}

function createKnowledge(x,y){
 knowledgeCount++;
 const data=BOOK_KNOWLEDGE[(knowledgeCount-1)%BOOK_KNOWLEDGE.length];
 const halfSize=29;
 const safeX=Math.max(halfSize,Math.min(window.innerWidth-halfSize,x));
 const safeY=Math.max(halfSize,Math.min(window.innerHeight-halfSize,y));
 const knowledge={number:knowledgeCount,title:data.title,text:data.text,x:safeX,y:safeY,targetX:safeX,targetY:safeY,element:null,pointerId:null,pointerStartX:0,pointerStartY:0,moved:false,dragging:false};
 const element=document.createElement('div');element.className='knowledge';element.textContent=knowledge.number;element.style.left=safeX+'px';element.style.top=safeY+'px';knowledge.element=element;document.body.appendChild(element);knowledgeObjects.push(knowledge);
 element.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();knowledge.pointerId=e.pointerId;knowledge.pointerStartX=e.clientX;knowledge.pointerStartY=e.clientY;knowledge.moved=false;knowledge.dragging=false;try{element.setPointerCapture(e.pointerId)}catch(err){}});
 element.addEventListener('pointermove',e=>{e.preventDefault();e.stopPropagation();if(knowledge.pointerId!==e.pointerId)return;const d=distance(knowledge.pointerStartX,knowledge.pointerStartY,e.clientX,e.clientY);if(d>10){knowledge.moved=true;knowledge.dragging=true;element.classList.add('dragging')}if(knowledge.dragging){knowledge.targetX=e.clientX;knowledge.targetY=e.clientY}});
 element.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();if(knowledge.pointerId!==e.pointerId)return;if(knowledge.moved){knowledge.dragging=false;element.classList.remove('dragging');knowledge.pointerId=null;return}knowledge.dragging=false;element.classList.remove('dragging');knowledge.pointerId=null;openReader(knowledge)});
 element.addEventListener('pointercancel',e=>{e.preventDefault();e.stopPropagation();knowledge.moved=true;knowledge.dragging=false;knowledge.pointerId=null;element.classList.remove('dragging')});
 openReader(knowledge);updateKnowledgeCounter();
}
function updateKnowledge(knowledge){const halfSize=29;knowledge.targetX=Math.max(halfSize,Math.min(window.innerWidth-halfSize,knowledge.targetX));knowledge.targetY=Math.max(halfSize,Math.min(window.innerHeight-halfSize,knowledge.targetY));knowledge.x+=(knowledge.targetX-knowledge.x)*0.10;knowledge.y+=(knowledge.targetY-knowledge.y)*0.10;knowledge.x=Math.max(halfSize,Math.min(window.innerWidth-halfSize,knowledge.x));knowledge.y=Math.max(halfSize,Math.min(window.innerHeight-halfSize,knowledge.y));knowledge.element.style.left=knowledge.x+'px';knowledge.element.style.top=knowledge.y+'px'}
function updateKnowledgeCounter(){document.getElementById('knowledgeCounter').textContent='KNOWLEDGE: '+knowledgeCount+' / '+BOOK_KNOWLEDGE.length}

function mergeOnes(oneA,oneB){
 const createsKnowledge=oneA.size>=MAX_SIZE&&oneB.size>=MAX_SIZE;
 const mergeX=(oneA.x+oneB.x)/2,mergeY=(oneA.y+oneB.y)/2;
 const mergedSize=Math.min(MAX_SIZE,oneA.size+oneB.size);
 oneA.element.remove();oneB.element.remove();ones=ones.filter(one=>one!==oneA&&one!==oneB);
 const mergedOne=createOne(mergeX,mergeY,mergedSize,true);selectedOne=mergedOne;growing=false;
 if(createsKnowledge)createKnowledge(mergeX,mergeY);
}
function checkForMerges(){if(ones.length<2)return;for(let i=0;i<ones.length;i++){for(let j=i+1;j<ones.length;j++){const a=ones[i],b=ones[j];if(distance(a.x,a.y,b.x,b.y)<=MERGE_DISTANCE){mergeOnes(a,b);return}}}}
function pointerDown(px,py){const now=Date.now(),closest=findClosestOne(px,py);if(!closest)return;if(now-lastTap<DOUBLE_TAP_TIME){splitOne(closest);lastTap=0;return}lastTap=now;selectedOne=closest;growing=true;selectedOne.targetX=px;selectedOne.targetY=py}
function pointerMove(px,py){if(!growing||!selectedOne)return;selectedOne.targetX=px;selectedOne.targetY=py}
function pointerUp(){growing=false}

document.addEventListener('pointerdown',e=>{if(e.target.closest('#reader')||e.target.closest('.knowledge')||e.target.id==='reset')return;pointerDown(e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{if(e.target.closest('#reader')||e.target.closest('.knowledge')||e.target.id==='reset')return;pointerMove(e.clientX,e.clientY)});
document.addEventListener('pointerup',e=>{if(e.target.closest('#reader')||e.target.closest('.knowledge'))return;pointerUp()});
document.addEventListener('pointercancel',e=>{if(e.target.closest('#reader')||e.target.closest('.knowledge'))return;pointerUp()});

const reader=document.getElementById('reader'),readerNumber=document.getElementById('readerNumber'),readerTitle=document.getElementById('readerTitle'),readerText=document.getElementById('readerText'),readerPause=document.getElementById('readerPause'),readerClose=document.getElementById('readerClose'),readerStatus=document.getElementById('readerStatus');
function openReader(knowledge){clearInterval(readerTimer);readerTimer=null;currentKnowledge=knowledge;readerPaused=false;readerPosition=0;readerNumber.textContent='KNOWLEDGE '+knowledge.number;readerTitle.textContent=knowledge.title;readerText.textContent='';readerText.scrollTop=0;readerPause.textContent='PAUSE';readerStatus.textContent='AUTO-READING';reader.classList.add('open');startReader()}
function startReader(){clearInterval(readerTimer);if(!currentKnowledge)return;readerTimer=setInterval(()=>{if(readerPaused)return;const fullText=currentKnowledge.text;if(readerPosition>=fullText.length){clearInterval(readerTimer);readerTimer=null;readerStatus.textContent='COMPLETE';return}readerPosition=Math.min(fullText.length,readerPosition+READER_SPEED);readerText.textContent=fullText.slice(0,readerPosition);readerText.scrollTop=readerText.scrollHeight},100)}
readerPause.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(!currentKnowledge)return;readerPaused=!readerPaused;if(readerPaused){readerPause.textContent='RESUME';readerStatus.textContent='PAUSED'}else{readerPause.textContent='PAUSE';readerStatus.textContent='AUTO-READING'}});
function closeReader(){clearInterval(readerTimer);readerTimer=null;currentKnowledge=null;readerPaused=false;readerPosition=0;readerText.textContent='';reader.classList.remove('open')}
readerClose.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();closeReader()});
reader.addEventListener('pointerdown',e=>e.stopPropagation());reader.addEventListener('pointermove',e=>e.stopPropagation());reader.addEventListener('pointerup',e=>e.stopPropagation());reader.addEventListener('pointercancel',e=>e.stopPropagation());

function resetGame(){closeReader();for(const one of ones)one.element.remove();ones=[];document.querySelectorAll('.trail').forEach(e=>e.remove());document.querySelectorAll('.knowledge').forEach(e=>e.remove());knowledgeObjects=[];knowledgeCount=0;updateKnowledgeCounter();selectedOne=createOne(window.innerWidth/2,window.innerHeight/2,MIN_SIZE,false);growing=false;lastTap=0}
document.getElementById('reset').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();resetGame()});
selectedOne=createOne(window.innerWidth/2,window.innerHeight/2,MIN_SIZE,false);
function animate(){for(const one of ones){one.x+=(one.targetX-one.x)*0.10;one.y+=(one.targetY-one.y)*0.10;if(growing&&selectedOne===one){one.size+=0.5;if(one.size>MAX_SIZE)one.size=MAX_SIZE}if(distance(one.x,one.y,one.lastTrailX,one.lastTrailY)>=TRAIL_DISTANCE){createTrail(one.x,one.y);one.lastTrailX=one.x;one.lastTrailY=one.y}updateOne(one)}for(const knowledge of knowledgeObjects)updateKnowledge(knowledge);checkForMerges();requestAnimationFrame(animate)}
animate();
</script>
</body>
</html>
